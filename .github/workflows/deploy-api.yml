name: Deploy API (ECR + ECS)

# Backend deploy, one environment per branch:
#
#   main    → production   (api.rooferslabs.com)
#   develop → development  (api.dev.rooferslabs.com)
#
# The branch decides which GitHub Environment supplies the configuration, and
# each environment's values point at that environment's cluster, registry and
# service. Nothing is shared between the two.
#
# This workflow is a CONVENIENCE WRAPPER around infra/scripts/deploy.sh — the
# script is the single source of truth for how the API image is built, pushed,
# and rolled out, and can be run locally on its own. Disabling or breaking this
# workflow never blocks a deploy.
#
# Requires, per GitHub Environment (Settings → Environments → production /
# development → Environment variables):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECS_CLUSTER, API_SERVICE, API_REPO,
#   API_HEALTH_URL
#
# AWS_DEPLOY_ROLE_ARN comes from that environment's
# `terraform output github_deploy_role_arn`. The two roles have different trust
# policies — production's trusts main alone, development's develop alone — so
# even a workflow edited to deploy the wrong environment fails at AssumeRole
# rather than reaching it.

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'docker/api.Dockerfile'
      - 'infra/scripts/deploy.sh'
      - 'infra/scripts/env.sh'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Never roll one environment's service from two runs at once, and never cancel a
# rollout midway — an interrupted `ecs wait` leaves the deploy in an unknown
# state. Keyed by ref so a development deploy never queues behind production.
concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  deploy:
    name: Build, push, and roll out the API
    runs-on: ubuntu-latest

    # Selects the variable and secret set. Also where a required reviewer on
    # production would be configured (Settings → Environments → protection
    # rules), with no workflow change needed.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace @rooferslabs/shared

      - name: Generate Prisma client
        run: npx --prefix apps/api prisma generate --schema apps/api/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck --workspace @rooferslabs/api

      - name: Lint
        run: npm run lint --workspace @rooferslabs/api

      # Backend deploy — gate only on the api workspace, mirroring how
      # deploy-web.yml gates only on web.
      - name: Test (api only)
        run: npm test --workspace @rooferslabs/api --if-present

      # Without this, an unset variable surfaces only as the AWS action's
      # opaque "Input required and not supplied: aws-region".
      - name: Check deploy configuration is present
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          API_SERVICE: ${{ vars.API_SERVICE }}
          API_REPO: ${{ vars.API_REPO }}
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          echo "Deploying the '$ENVIRONMENT' environment from '${{ github.ref_name }}'."
          missing=()
          for v in AWS_REGION AWS_DEPLOY_ROLE_ARN ECS_CLUSTER API_SERVICE API_REPO API_HEALTH_URL; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing deploy configuration for $ENVIRONMENT: ${missing[*]}"
            echo "Set these under Settings → Environments → $ENVIRONMENT." >&2
            echo "AWS_DEPLOY_ROLE_ARN comes from 'terraform output github_deploy_role_arn'" >&2
            echo "in infra/terraform/envs/$ENVIRONMENT." >&2
            exit 1
          fi

          # Every resource name carries the environment, so a variable set
          # copied to the wrong GitHub Environment is caught here — before
          # anything is built, pushed, or rolled out.
          case "$ECS_CLUSTER" in
            *"$ENVIRONMENT"*) ;;
            *)
              echo "::error::ECS_CLUSTER='$ECS_CLUSTER' does not name the '$ENVIRONMENT' environment."
              echo "This GitHub Environment's variables look like they belong to the other one." >&2
              exit 1
              ;;
          esac

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Build + push + roll out + verify, all from the same script used locally.
      # Every value it would otherwise read from Terraform outputs is supplied
      # here, so no Terraform state is needed in CI.
      - name: Deploy (build, push, roll out, verify)
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          API_SERVICE: ${{ vars.API_SERVICE }}
          API_REPO: ${{ vars.API_REPO }}
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: ./infra/scripts/deploy.sh "$ENVIRONMENT"

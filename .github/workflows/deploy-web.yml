name: Deploy Web (S3 + CloudFront)

# Production frontend deploy. This workflow is a CONVENIENCE WRAPPER around
# infra/scripts/deploy-web.sh — the script is the single source of truth for how
# the SPA is built, uploaded, and invalidated, and can be run locally on its own.
# Disabling or breaking this workflow never blocks a deploy.
#
# Requires (repo Settings → Secrets and variables):
#   Variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN (GitHub OIDC role),
#              WEB_BUCKET, WEB_DISTRIBUTION_ID, VITE_API_BASE_URL
#   Secrets:   VITE_CLERK_PUBLISHABLE_KEY (pk_live_…)
# The job fails immediately if any step fails.

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'infra/scripts/deploy-web.sh'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  deploy:
    name: Build, verify, and deploy the SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace @rooferslabs/shared

      - name: Typecheck
        run: npm run typecheck --workspace @rooferslabs/web

      - name: Lint
        run: npm run lint --workspace @rooferslabs/web

      # Frontend deploy — gate only on the web workspace. The API has its own
      # pipeline; a Prisma/API test failure must never block a web release.
      - name: Test (web only)
        run: npm test --workspace @rooferslabs/web --if-present

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Build + upload + invalidate + verify, all from the same script used
      # locally. Every value it would otherwise read from Terraform outputs is
      # supplied here, so no Terraform state is needed in CI.
      - name: Deploy (build, upload, invalidate, verify)
        env:
          SKIP_INSTALL: '1' # dependencies are already installed above
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          # Defaults to the public site; set WEB_VERIFY_URL to the CloudFront
          # domain to verify before the DNS cutover.
          WEB_VERIFY_URL: ${{ vars.WEB_VERIFY_URL || 'https://rooferslabs.com' }}
        run: ./infra/scripts/deploy-web.sh

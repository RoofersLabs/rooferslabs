name: Deploy Web (S3 + CloudFront)

# Production frontend deploy. This workflow is a CONVENIENCE WRAPPER around
# infra/scripts/deploy-web.sh — the script is the single source of truth for how
# the SPA is built, uploaded, and invalidated, and can be run locally on its own.
# Disabling or breaking this workflow never blocks a deploy.
#
# PRODUCTION ONLY. `main` is the sole branch that can reach this workflow, and
# the sole branch AWS will issue production credentials to — the OIDC role's
# trust policy names `main` and nothing else (modules/platform passes
# github_deploy_branches = ["main"]).
#
# That redundancy is deliberate. This file previously triggered on
# [main, develop] with repo-level variables, so a push to develop deployed
# straight to rooferslabs.com. Editing this trigger back is no longer enough to
# recreate that: AWS would refuse the role assumption. There is no development
# deploy to add here — development runs on localhost and has no hosting.
#
# Requires (repo Settings → Environments → production):
#   Variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN (GitHub OIDC role),
#              WEB_BUCKET, WEB_DISTRIBUTION_ID, VITE_API_BASE_URL
#   Secrets:   VITE_CLERK_PUBLISHABLE_KEY (pk_live_…)
# The job fails immediately if any step fails.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'infra/scripts/deploy-web.sh'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  deploy:
    name: Build, verify, and deploy the SPA
    runs-on: ubuntu-latest
    # Scopes the variables and secrets below to the production GitHub
    # Environment, so production credentials are not readable by a run on any
    # other ref, and can carry a protection rule restricting them to `main`.
    environment: production
    # Belt and braces: `on.push.branches` already restricts this, but
    # workflow_dispatch does not, and a manual run from develop would otherwise
    # build develop's code and ship it to production.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace @rooferslabs/shared

      - name: Typecheck
        run: npm run typecheck --workspace @rooferslabs/web

      - name: Lint
        run: npm run lint --workspace @rooferslabs/web

      # Frontend deploy — gate only on the web workspace. The API has its own
      # pipeline; a Prisma/API test failure must never block a web release.
      - name: Test (web only)
        run: npm test --workspace @rooferslabs/web --if-present

      # Without this, an unset variable surfaces only as the AWS action's
      # opaque "Input required and not supplied: aws-region".
      - name: Check deploy configuration is present
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          missing=()
          for v in AWS_REGION AWS_DEPLOY_ROLE_ARN WEB_BUCKET WEB_DISTRIBUTION_ID \
                   VITE_API_BASE_URL VITE_CLERK_PUBLISHABLE_KEY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing deploy configuration: ${missing[*]}"
            echo "Set these under Settings → Secrets and variables → Actions." >&2
            echo "AWS_DEPLOY_ROLE_ARN comes from 'terraform output github_deploy_role_arn'." >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Build + upload + invalidate + verify, all from the same script used
      # locally. Every value it would otherwise read from Terraform outputs is
      # supplied here, so no Terraform state is needed in CI.
      - name: Deploy (build, upload, invalidate, verify)
        env:
          SKIP_INSTALL: '1' # dependencies are already installed above
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          # Defaults to the public site; set WEB_VERIFY_URL to the CloudFront
          # domain to verify before the DNS cutover.
          WEB_VERIFY_URL: ${{ vars.WEB_VERIFY_URL || 'https://rooferslabs.com' }}
        run: ./infra/scripts/deploy-web.sh

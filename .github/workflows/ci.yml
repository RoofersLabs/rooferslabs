name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace @rooferslabs/shared

      - name: Generate Prisma client
        run: npx --prefix apps/api prisma generate --schema apps/api/prisma/schema.prisma

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint all workspaces
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build API
        run: npm run build --workspace @rooferslabs/api

      - name: Build Web (PWA)
        run: npm run build --workspace @rooferslabs/web
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder_for_build
          VITE_API_BASE_URL: ''

      - name: Run tests
        run: npm test

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.6'

      - name: Format check
        run: terraform -chdir=infra/terraform fmt -recursive -check

      - name: Validate
        run: |
          terraform -chdir=infra/terraform/envs/production init -backend=false -input=false
          terraform -chdir=infra/terraform/envs/production validate

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t rooferslabs-api:ci .

      - name: Build Web image
        run: |
          docker build -f docker/web.Dockerfile \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_placeholder_for_build \
            --build-arg VITE_API_BASE_URL=https://api.example.com \
            -t rooferslabs-web:ci .

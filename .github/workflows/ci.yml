name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# CI only ever reads the repo. No job here publishes an image or assumes an AWS
# role — deploys live in deploy-web.yml, which grants its own id-token scope.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace @rooferslabs/shared

      - name: Generate Prisma client
        run: npx --prefix apps/api prisma generate --schema apps/api/prisma/schema.prisma

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint all workspaces
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build API
        run: npm run build --workspace @rooferslabs/api

      - name: Build Web (PWA)
        run: npm run build --workspace @rooferslabs/web
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder_for_build
          VITE_API_BASE_URL: ''

      - name: Run tests
        run: npm test

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.6'

      - name: Format check
        run: terraform -chdir=infra/terraform fmt -recursive -check

      # Both roots, always. A change to a shared module can validate against one
      # environment and break the other, and the environment it breaks is
      # whichever one nobody checked.
      - name: Validate
        run: |
          for env in production development; do
            echo "── $env ─────────────────────────────────────────────"
            terraform -chdir="infra/terraform/envs/$env" init -backend=false -input=false
            terraform -chdir="infra/terraform/envs/$env" validate
          done

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      # The API is the only production container image. The frontend deploys to
      # S3 + CloudFront (see deploy-web.yml); web.Dockerfile is kept for
      # self-hosted deployments and is not built here.
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t rooferslabs-api:ci .

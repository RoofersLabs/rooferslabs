name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# CI only ever reads the repo. No job here publishes an image or assumes an AWS
# role — deploys live in deploy-web.yml/deploy-api.yml, which grant their own
# id-token scope and run on `main` only.
#
# This is the whole pipeline for `develop`: lint, typecheck, build, test, stop.
# There is deliberately nothing after it. Development is not a deployed
# environment — it runs on localhost against its own RDS instance — so a green
# run on develop means the code is sound, not that anything shipped.
#
# `permissions: contents: read` is what makes that structural: without
# `id-token: write` no job in this file can obtain an AWS credential at all,
# whatever it is edited to try.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace @rooferslabs/shared

      - name: Generate Prisma client
        run: npx --prefix apps/api prisma generate --schema apps/api/prisma/schema.prisma

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint all workspaces
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build API
        run: npm run build --workspace @rooferslabs/api

      # Production build verification: proves the bundle and service worker
      # compile, nothing more. These values are placeholders and the artifact is
      # discarded — CI never uploads it anywhere. The real production build runs
      # in deploy-web.sh, which resolves the live values from Terraform and
      # refuses to proceed on a non-pk_live_ Clerk key.
      - name: Build Web (PWA)
        run: npm run build --workspace @rooferslabs/web
        env:
          VITE_APP_ENV: production
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder_for_build
          VITE_API_BASE_URL: ''

      - name: Run tests
        run: npm test

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.6'

      - name: Format check
        run: terraform -chdir=infra/terraform fmt -recursive -check

      # -backend=false is load-bearing, not incidental: it is what keeps the
      # production state file unreachable from a CI run. `validate` needs no
      # backend, so nothing here can read, lock, or write state — and there is
      # deliberately no `plan` or `apply` step in this workflow at all.
      - name: Validate every root
        run: |
          for root in bootstrap envs/production envs/development; do
            echo "--- $root ---"
            terraform -chdir="infra/terraform/$root" init -backend=false -input=false
            terraform -chdir="infra/terraform/$root" validate
          done

  deployment-guards:
    name: Production deployment guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the build if any path to production becomes reachable from a
      # branch other than main. The protections live in several files and none
      # of them fails loudly when deleted, so they are asserted here rather than
      # trusted to survive future edits.
      - name: Assert only main can deploy production
        run: bash scripts/check-deploy-guards.sh

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      # The API is the only production container image. The frontend deploys to
      # S3 + CloudFront (see deploy-web.yml); web.Dockerfile remains for the
      # local docker-compose full-stack profile only.
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t rooferslabs-api:ci .

# =============================================================================
# RoofersLabs — local & self-hosted infrastructure
# =============================================================================
# Usage:
#   docker compose -f docker/docker-compose.yml up -d postgres redis   # deps only
#   docker compose -f docker/docker-compose.yml up -d                  # full stack
#
# In production, Postgres → Amazon RDS, Redis → Amazon ElastiCache, the api
# image runs on Amazon ECS / Fargate, and the frontend on S3 + CloudFront
# (see infra/terraform/README.md). The web service below is local-dev only.
# =============================================================================
name: rooferslabs

services:
  postgres:
    image: postgres:16-alpine
    container_name: rooferslabs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rooferslabs
      POSTGRES_PASSWORD: rooferslabs
      POSTGRES_DB: rooferslabs
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rooferslabs -d rooferslabs']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rooferslabs-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: rooferslabs-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://rooferslabs:rooferslabs@postgres:5432/rooferslabs?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: '4000'
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
        VITE_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    container_name: rooferslabs-web
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
